# ===================================================================
# NEXT/PREV FRAMES
# ===================================================================
. frame-step                         # Dot: next frame
, frame-back-step                     # Comma: previous frame

# ===================================================================
# PLAYLIST NAVIGATION (Synchronized position)
# ===================================================================
RIGHT script-binding sync-next       # Right arrow: next file (same frame)
LEFT  script-binding sync-prev       # Left arrow: previous file (same frame)

# ===================================================================
# ZOOM
# ===================================================================
UP         add video-zoom  0.1        # Up arrow: zoom in
DOWN       add video-zoom -0.1        # Down arrow: zoom out
=          add video-zoom  0.1        # Equals key: zoom in
-          add video-zoom -0.1        # Minus key: zoom out
WHEEL_UP   add video-zoom  0.1        # Wheel up: zoom in
WHEEL_DOWN add video-zoom -0.1        # Wheel down: zoom out

# ===================================================================
# PANNING
# ===================================================================
Ctrl+LEFT  add video-pan-x  0.02      # Ctrl + Left: pan right
Ctrl+RIGHT add video-pan-x -0.02      # Ctrl + Right: pan left
Ctrl+UP    add video-pan-y  0.02      # Ctrl + Up: pan down
Ctrl+DOWN  add video-pan-y -0.02      # Ctrl + Down: pan up

# ===================================================================
# PLAYBACK SPEED
# ===================================================================
] add speed  0.1                      # Right bracket: speed up
[ add speed -0.1                      # Left bracket: slow down

# ===================================================================
# SEEKING BY PERCENTAGE
# ===================================================================
< seek -10 relative-percent exact     # Seek -10% of total length
> seek  10 relative-percent exact     # Seek +10% of total length

# ===================================================================
# TIME SEEKING
# ===================================================================
Shift+LEFT  seek -1 exact             # Seek -5 seconds (exact)
Shift+RIGHT seek  1 exact             # Seek +5 seconds (exact)
Shift+UP    seek  5 exact            # Seek +30 seconds (exact)
Shift+DOWN  seek -5 exact            # Seek -30 seconds (exact)

# ===================================================================
# RESET
# ===================================================================
BS set video-zoom 0; set video-pan-x 0; set video-pan-y 0; set speed 1.0  # Backspace: reset view & speed

# ===================================================================
# HELP / CHEAT SHEET (Press 'h' to show controls for 5 seconds)
# ===================================================================
h show-text "CONTROLS:\n. / , : Frame step / back\nLeft / Right : Prev / Next file\nUp / Down : Zoom in / out\nCtrl + Arrows : Pan video\nShift + Left/Right : Seek +/- 1s\nShift + Up/Down : 5s Seek +/- 5s\n< / > : Seek +/- 10%\n[ / ] : Speed (-/+)\nBS : Reset view & speed" 5000
