# ===================================================================
# WINDOW & RENDERING
# ===================================================================
fullscreen=yes
video-unscaled=yes
background='#4f7942'
loop-playlist=inf
loop-file=inf

# Disable hardware acceleration to prevent driver errors and freezing
hwdec=no

# Fast scaling & rendering configuration
scale=nearest
cscale=nearest
dscale=mitchell
correct-downscaling=no
sws-scaler=fast-bilinear

# Multi-threaded CPU decoding for maximum stability
vd-lavc-threads=4
cache=no

# ===================================================================
# FAST LOADING & PREFETCH OPTIMIZATIONS
# ===================================================================
sub-auto=no
audio-file-auto=no
cover-art-auto=no
prefetch-playlist=yes
hr-seek=no
vd-lavc-fast=yes
keep-open=always

# ===================================================================
# OSD POSITION & FONT SETTINGS
# ===================================================================
msg-level=cplayer=warn,auto_profiles=warn
term-playing-msg=""

osd-level=3
osd-align-x=left
osd-align-y=top
osd-margin-x=10
osd-margin-y=10
osd-font-size=18
osd-font="DejaVu Sans Mono"

# Default OSD layout (for videos)
osd-status-msg="${path}\nplist: ${playlist-pos-1} / ${playlist-count}\nframe: ${estimated-frame-number} / ${estimated-frame-count}"

# ===================================================================
# PROFILES
# ===================================================================
[image-osd]
profile-cond=p["current-tracks/video/image"] == true
osd-status-msg="${path}\nplist: ${playlist-pos-1} / ${playlist-count}"
untimed=yes
swapchain-depth=1
