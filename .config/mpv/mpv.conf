# Run fullscreen in native video resolution (no scaling)
fullscreen=yes
video-unscaled=yes
background='#4f7942'

# Disable interpolation (sharp, clean pixels when zooming - Nearest Neighbor)
scale=nearest
cscale=nearest
dscale=nearest

# Display frame number in top-right corner
osd-level=3
osd-status-msg='Frame: ${estimated-frame-number} / ${estimated-frame-count}'
osd-align-x=right
osd-align-y=top
osd-margin-x=20
osd-margin-y=20
osd-font-size=26
